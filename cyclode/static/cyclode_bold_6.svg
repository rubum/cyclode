<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="cyclodeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181A1F"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>
  <!-- Dark background disc -->
  <circle cx="64" cy="64" r="62" fill="url(#cyclodeBg)"/>
  
  <!-- Outer boundary ring (bold) -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-opacity="0.95"/>
  <!-- Inner boundary ring (bold) -->
  <circle cx="64" cy="64" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-opacity="0.95"/>
  
  <!-- 6 bold intersecting circular chords -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <circle cx="81.0" cy="64.0" r="37.0" />    <circle cx="72.5" cy="78.7" r="37.0" />    <circle cx="55.5" cy="78.7" r="37.0" />    <circle cx="47.0" cy="64.0" r="37.0" />    <circle cx="55.5" cy="49.3" r="37.0" />    <circle cx="72.5" cy="49.3" r="37.0" />
  </g>
</svg>