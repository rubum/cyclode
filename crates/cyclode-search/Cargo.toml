[package]
name = "cyclode-search"
version = "1.0.0"
edition = "2021"
authors = ["Mburun <mburun.dev@gmail.com>"]
description = "High-performance trigram indexed search and Tree-sitter code intelligence engine for Cyclode"
license = "MIT"

[lib]
name = "cyclode_search"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cyclode-searchd"
path = "src/main.rs"

[dependencies]
# AST & Parsing
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-go = "0.21"

# High-Performance Search & I/O
regex = "1.10"
memchr = "2.7"
memmap2 = "0.9"
rayon = "1.10"
notify = "6.1"
walkdir = "2.5"

# Serialization & CLI / Server
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

# Optional Python C-ABI bindings
pyo3 = { version = "0.21", features = ["extension-module"], optional = true }

[features]
default = []
python = ["pyo3"]
