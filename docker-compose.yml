services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cyclode-backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./.agents:/app/.agents:ro
      - ../Ingrations:/ingrations:ro
      - ./workspaces:/workspaces
      - cyclode_data:/data
      - /tmp/cyclode_sockets:/cyclode_sockets
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/ingrations
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=development
      - DEBUG=true
      - WORKSPACE_ROOT=/workspaces
      - HOST_WORKSPACE_ROOT=${HOST_WORKSPACE_ROOT:-${PWD}/workspaces}
      - CYCLODE_HOME=/data
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://cyclode:cyclode@postgres:5432/cyclode}
      - PREVIEW_PROXY_URL=${PREVIEW_PROXY_URL:-http://localhost:5175}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
      - ANTIGRAVITY_MODEL=${ANTIGRAVITY_MODEL:-gemini-3.7-flash}
      - ANTIGRAVITY_ENABLE_THINKING=${ANTIGRAVITY_ENABLE_THINKING:-true}
      - POLICY_GIT_PUSH=${POLICY_GIT_PUSH:-require_approval}
      - POLICY_CREATE_PR=${POLICY_CREATE_PR:-require_approval}
      - POLICY_POST_COMMENTS=${POLICY_POST_COMMENTS:-auto}
      - POLICY_SLACK_NOTIFY=${POLICY_SLACK_NOTIFY:-auto}
      - POLICY_MERGE_PR=${POLICY_MERGE_PR:-require_approval}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-cyclode_gh_webhook_secret_123}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - APPSIGNAL_API_KEY=${APPSIGNAL_API_KEY:-}
      - APPSIGNAL_WEBHOOK_TOKEN=${APPSIGNAL_WEBHOOK_TOKEN:-cyclode_appsignal_token_123}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cyclode-net

  postgres:
    image: postgres:17-alpine
    container_name: cyclode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyclode
      POSTGRES_PASSWORD: cyclode
      POSTGRES_DB: cyclode
    volumes:
      - cyclode_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyclode -d cyclode"]
      interval: 4s
      timeout: 3s
      retries: 6
    networks:
      - cyclode-net

  proxy:
    image: caddy:2-alpine
    container_name: cyclode-proxy
    restart: unless-stopped
    ports:
      - "${PREVIEW_PORT:-5175}:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - cyclode-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cyclode-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT:-5174}
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws/live
      - VITE_PREVIEW_PROXY_URL=http://localhost:5175
    depends_on:
      - backend
    networks:
      - cyclode-net

volumes:
  cyclode_data:
    name: cyclode_data
  cyclode_pgdata:
    name: cyclode_pgdata

networks:
  cyclode-net:
    name: cyclode-net
    driver: bridge
