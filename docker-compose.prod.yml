services:
  cyclode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyclode-app
    restart: always
    ports:
      - "${PROD_PORT:-8080}:8080"
    volumes:
      - ./workspaces:/workspaces
      - cyclode_prod_data:/data
    env_file:
      - .env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - DEBUG=false
      - WORKSPACE_ROOT=/workspaces
      - DATABASE_URL=sqlite+aiosqlite:////data/cyclode.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cyclode-net

volumes:
  cyclode_prod_data:
    name: cyclode_prod_data

networks:
  cyclode-net:
    name: cyclode-net
    driver: bridge
